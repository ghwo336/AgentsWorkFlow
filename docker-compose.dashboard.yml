services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3737}:3737"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # 시각 표시는 lib/time이 Asia/Seoul로 고정하지만, 거길 안 거치는 코드가
      # 생겨도 UTC로 새지 않게 컨테이너 TZ도 한국시간으로.
      TZ: Asia/Seoul
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      ORCH_INTERNAL_URL: ${ORCH_INTERNAL_URL:-http://host.docker.internal:4000}
      # Shared secret for the orchestrator API (Bearer) — same value the host
      # orchestrator reads from the root .env.
      ORCH_TOKEN: ${ORCH_TOKEN:-}
      DASHBOARD_AUTH_REQUIRED: ${DASHBOARD_AUTH_REQUIRED:-true}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?set DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD}
      # Repo picker scans this path; it must resolve to the same host paths the
      # host-side orchestrator uses, so the srv tree is mounted 1:1 below.
      REPO_SCAN_ROOTS: ${REPO_SCAN_ROOTS:-/Users/Shared/srv}
    volumes:
      - ./prisma:/app/prisma
      # Read-only so the dashboard can list git repos; the orchestrator (on the
      # host) is what actually writes to them.
      - /Users/Shared/srv:/Users/Shared/srv:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
